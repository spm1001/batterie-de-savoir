<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Background -->
  <rect width="1280" height="720" fill="#f8fafc"/>

  <!-- Title -->
  <text x="640" y="42" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="700" fill="#0f172a">Batterie Hook Map</text>
  <text x="640" y="68" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#64748b">Session lifecycle hooks — 3 of 28 Claude Code events used</text>

  <!-- Timeline -->
  <line x1="100" y1="210" x2="1180" y2="210" stroke="#cbd5e1" stroke-width="3"/>

  <!-- Phase dots — solid for active, dashed for unused -->
  <circle cx="160" cy="210" r="9" fill="#475569"/>
  <circle cx="400" cy="210" r="9" fill="#475569"/>
  <circle cx="620" cy="210" r="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 2"/>
  <circle cx="840" cy="210" r="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 2"/>
  <circle cx="1080" cy="210" r="9" fill="#475569"/>

  <!-- Phase labels -->
  <text x="160" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#0f172a">Session Start</text>
  <text x="400" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#0f172a">Each Prompt</text>
  <text x="620" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#94a3b8">Compaction</text>
  <text x="840" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#94a3b8">Claude Stops</text>
  <text x="1080" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#0f172a">Session End</text>

  <!-- ==================== -->
  <!-- ABOVE TIMELINE: Available but unused (opportunities) -->
  <!-- ==================== -->

  <!-- CwdChanged — above Each Prompt -->
  <line x1="400" y1="210" x2="400" y2="148" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="318" y="114" width="164" height="34" rx="6" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="400" y="131" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" dy="0.35em">CwdChanged</text>

  <!-- PreCompact — above Compaction -->
  <line x1="620" y1="210" x2="620" y2="148" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="538" y="114" width="164" height="34" rx="6" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="620" y="131" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" dy="0.35em">PreCompact / PostCompact</text>

  <!-- Stop — above Claude Stops (KEY opportunity, highlighted) -->
  <line x1="840" y1="210" x2="840" y2="148" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="758" y="100" width="164" height="48" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="2" stroke-dasharray="6 3"/>
  <g transform="translate(840, 116)">
    <text x="0" y="0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#ea580c" font-weight="600" dy="0.35em">Stop hook</text>
    <text x="0" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#ea580c" font-style="italic" dy="0.35em">kuriwe: auto-close</text>
  </g>

  <!-- ==================== -->
  <!-- BELOW TIMELINE: Active hooks -->
  <!-- ==================== -->

  <!-- SESSION START — 5 hooks -->
  <!-- bon/ensure-bon -->
  <rect x="78" y="232" width="164" height="34" rx="6" fill="#3b82f6"/>
  <text x="160" y="249" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="white" dy="0.35em">ensure-bon</text>

  <!-- bon/session-start -->
  <rect x="78" y="272" width="164" height="34" rx="6" fill="#3b82f6"/>
  <text x="160" y="289" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="white" dy="0.35em">session-start</text>

  <!-- garde/ensure-garde -->
  <rect x="78" y="312" width="164" height="34" rx="6" fill="#8b5cf6"/>
  <text x="160" y="329" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="white" dy="0.35em">ensure-garde</text>

  <!-- mise/ensure-mise -->
  <rect x="78" y="352" width="164" height="34" rx="6" fill="#ec4899"/>
  <text x="160" y="369" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="white" dy="0.35em">ensure-mise</text>

  <!-- todoist/ensure-todoist -->
  <rect x="78" y="392" width="164" height="34" rx="6" fill="#06b6d4"/>
  <text x="160" y="409" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="white" dy="0.35em">ensure-todoist</text>

  <!-- EACH PROMPT — 2 hooks -->
  <!-- bon/bon-tactical -->
  <rect x="318" y="232" width="164" height="34" rx="6" fill="#3b82f6"/>
  <text x="400" y="249" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="white" dy="0.35em">bon-tactical</text>

  <!-- global/context-budget -->
  <rect x="318" y="272" width="164" height="34" rx="6" fill="#f59e0b"/>
  <text x="400" y="289" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="white" dy="0.35em">context-budget</text>

  <!-- SESSION END — 2 hooks -->
  <!-- bon/session-end -->
  <rect x="998" y="232" width="164" height="34" rx="6" fill="#3b82f6"/>
  <text x="1080" y="249" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="white" dy="0.35em">session-end</text>

  <!-- garde/session-end -->
  <rect x="998" y="272" width="164" height="34" rx="6" fill="#8b5cf6"/>
  <text x="1080" y="289" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="white" dy="0.35em">session-end</text>

  <!-- ==================== -->
  <!-- ANNOTATIONS -->
  <!-- ==================== -->

  <!-- pobumi annotation — small, below session-start stack -->
  <text x="160" y="440" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#2563eb" font-style="italic" dy="0.35em">pobumi: enrich session-start</text>

  <!-- ==================== -->
  <!-- BON DOMINANCE CALLOUT -->
  <!-- ==================== -->
  <rect x="80" y="470" width="340" height="100" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <g transform="translate(100, 495)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1e40af">Bon owns 4 of 8 active hooks</text>
    <text x="0" y="22" font-family="system-ui, sans-serif" font-size="12" fill="#3b82f6">SessionStart (2) + UserPromptSubmit (1) + SessionEnd (1)</text>
    <text x="0" y="42" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">All hooks owned by their source repo. No mismatches.</text>
  </g>

  <!-- Key opportunity callout -->
  <rect x="460" y="470" width="380" height="100" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
  <g transform="translate(480, 495)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#c2410c">Key opportunity: Stop hook</text>
    <text x="0" y="22" font-family="system-ui, sans-serif" font-size="12" fill="#ea580c">Can block — "you haven't run /close, do it now"</text>
    <text x="0" y="42" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Interactive, unlike SessionEnd (fire-and-forget)</text>
  </g>

  <!-- Stats callout -->
  <rect x="880" y="470" width="310" height="100" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <g transform="translate(900, 495)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#166534">28 events available</text>
    <text x="0" y="22" font-family="system-ui, sans-serif" font-size="12" fill="#16a34a">Using: SessionStart, UserPromptSubmit, SessionEnd</text>
    <text x="0" y="42" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">25 unused — Stop, Compact, CwdChanged key</text>
  </g>

  <!-- ==================== -->
  <!-- LEGEND -->
  <!-- ==================== -->
  <g transform="translate(80, 620)">
    <rect x="0" y="0" width="16" height="16" rx="4" fill="#3b82f6"/>
    <text x="22" y="12" font-family="system-ui, sans-serif" font-size="13" fill="#475569">bon</text>

    <rect x="90" y="0" width="16" height="16" rx="4" fill="#8b5cf6"/>
    <text x="112" y="12" font-family="system-ui, sans-serif" font-size="13" fill="#475569">garde-manger</text>

    <rect x="240" y="0" width="16" height="16" rx="4" fill="#ec4899"/>
    <text x="262" y="12" font-family="system-ui, sans-serif" font-size="13" fill="#475569">mise</text>

    <rect x="320" y="0" width="16" height="16" rx="4" fill="#06b6d4"/>
    <text x="342" y="12" font-family="system-ui, sans-serif" font-size="13" fill="#475569">todoist-gtd</text>

    <rect x="450" y="0" width="16" height="16" rx="4" fill="#f59e0b"/>
    <text x="472" y="12" font-family="system-ui, sans-serif" font-size="13" fill="#475569">global (~/.claude)</text>

    <rect x="640" y="0" width="16" height="16" rx="4" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="662" y="12" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">available, unused</text>

    <rect x="810" y="0" width="16" height="16" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-width="2" stroke-dasharray="4 2"/>
    <text x="832" y="12" font-family="system-ui, sans-serif" font-size="13" fill="#ea580c">key opportunity</text>
  </g>

  <!-- Date -->
  <text x="1200" y="700" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">2026-03-30</text>
</svg>

name: Lint registry

on:
  push:
  pull_request:
  schedule:
    - cron: '0 7 * * 1'  # Weekly Monday 07:00 UTC — re-checks GENERATED drift

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8

      - name: Check GENERATED sections are up to date
        run: uv run --script scripts/lint.py

      - name: README skill table matches skills/
        run: uv run --script scripts/render-skills.py . --check

      - name: Unit tests — publish.py (bump arithmetic, surgical version-write, dry-run contract)
        run: uv run --script tests/test_publish.py

      - name: Unit tests — marketplace-aware update/version discovery
        run: uv run --script tests/test_marketplace_aware.py

      # NOTE: the cross-repo plugin structural lint (scripts/batterie-lint.py)
      # is NOT run here. Since the 2026-06-10 marketplace cutover it requires
      # every source repo checked out as a SIBLING (it reads marketplace.json
      # from the spm1001/batterie clone), which only the assemble workflow
      # provides — it clones the siblings and runs `batterie-lint.py --local`
      # against this repo's copy of the script. Re-adding it here just fails:
      # this single-repo checkout has no siblings. The script lives here as the
      # source of truth; the assemble bot is where it actually runs.

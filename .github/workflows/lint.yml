name: Lint registry

on:
  push:
  pull_request:
  schedule:
    - cron: '0 7 * * 1'  # Weekly Monday 07:00 UTC — catches cross-repo drift

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8

      - name: Check GENERATED sections are up to date
        run: uv run --script scripts/lint.py

      - name: Lint plugin structure (all plugins)
        run: uv run --script scripts/batterie-lint.py

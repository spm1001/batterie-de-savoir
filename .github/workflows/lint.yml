name: Lint registry

on:
  push:
  pull_request:
  schedule:
    - cron: '0 7 * * 1'  # Weekly Monday 07:00 UTC — catches cross-repo drift

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8

      - name: Check GENERATED sections are up to date
        run: uv run --script scripts/lint.py

      - name: Lint plugin structure (all plugins)
        run: uv run --script scripts/batterie-lint.py
